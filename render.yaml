# PROPOSAL ONLY. Creating/syncing this Blueprint requires separate operator approval.
# No database, disk, cron, secret generation or existing service changes are defined.
# First deploy must target a reviewed, published SHA; historical main is not approved.
services:
  - type: web
    name: benaa-api-staging
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/khaledazam/_benaa
    rootDir: .
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev --legacy-peer-deps --ignore-scripts && npm run build
    startCommand: exec node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port "$PORT"
    healthCheckPath: /api/livez
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: BENAA_DEPLOYMENT_ENV
        value: staging
      - key: BENAA_WRITE_DISABLED
        value: 'true'
      - key: BENAA_DATABASE_NAME
        value: benaa_staging
      - key: DATABASE_URL
        sync: false
      - key: BENAA_DATABASE_HOST
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: BENAA_ALLOWED_ORIGINS
        sync: false
      - key: BENAA_RELEASE_SHA
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: BENAA_REDIS_HOST
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
